<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Experience: Micron Technology, Data Analyst Intern, 2023. Collins Aerospace, Software Engineer Intern, 2024, data-transfer automation with 80% faster processing. KCIC, Database Developer, 2025 to now, AI-assisted workflow automation.">
  <defs>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <radialGradient id="dot"><stop offset="0" stop-color="#fff"/><stop offset="0.4" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="258" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <rect x="90" y="88.5" width="1020" height="3" rx="1.5" fill="url(#line)" opacity="0.8"/>
  <circle cx="90" cy="90" r="9" fill="url(#dot)">
    <animate attributeName="cx" values="90;1110" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <text x="200" y="56" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#22d3ee">2023</text>
  
  <circle cx="200" cy="90" r="11" fill="#0b0f19" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="200" cy="90" r="4.5" fill="#22d3ee"/>
  <text x="200" y="140" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f8fafc">Micron Technology</text>
  <text x="200" y="166" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#22d3ee">Data Analyst Intern</text>
  <text x="200" y="198" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">SAP data analysis automation</text>
  <text x="200" y="220" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">and material tracking</text>

  <text x="600" y="56" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#a855f7">2024</text>
  
  <circle cx="600" cy="90" r="11" fill="#0b0f19" stroke="#a855f7" stroke-width="3"/>
  <circle cx="600" cy="90" r="4.5" fill="#a855f7"/>
  <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f8fafc">Collins Aerospace (RTX)</text>
  <text x="600" y="166" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#a855f7">Software Engineer Intern</text>
  <text x="600" y="198" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">Data-transfer automation:</text>
  <text x="600" y="220" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#f8fafc" font-weight="700">80% faster processing</text>

  <text x="1000" y="56" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#f472b6">2025 – now</text>
  <circle cx="1000" cy="90" r="11" fill="none" stroke="#f472b6" stroke-width="2"><animate attributeName="r" values="11;24" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="90" r="11" fill="#0b0f19" stroke="#f472b6" stroke-width="3"/>
  <circle cx="1000" cy="90" r="4.5" fill="#f472b6"/>
  <text x="1000" y="140" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f8fafc">KCIC</text>
  <text x="1000" y="166" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f472b6">Database Developer</text>
  <text x="1000" y="198" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">AI-assisted workflow automation</text>
  <text x="1000" y="220" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">and client-facing AI demos</text>
</svg>
